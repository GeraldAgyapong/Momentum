version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: momentum_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momentum}
      POSTGRES_USER: ${POSTGRES_USER:-momentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum} -d ${POSTGRES_DB:-momentum}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
